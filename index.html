
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090606">
<title>Chilli Hub V6</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --red: #ff303b;
  --red-hot: #ff542f;
  --dark: #090606;
  --panel: rgba(22, 12, 13, .92);
  --muted: #a99b9c;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 22px;
  color: white;
  font-family: 'Inter', sans-serif;
  background:
    radial-gradient(ellipse at 50% 42%, #361011 0%, transparent 48%),
    radial-gradient(ellipse at 10% 90%, #260b0b 0%, transparent 40%),
    #090606;
}

#embers {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

.glow {
  position: fixed;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: #ff2020;
  filter: blur(140px);
  opacity: .13;
  pointer-events: none;
  animation: glowMove 7s ease-in-out infinite alternate;
}

.glow.one {
  top: -140px;
  left: -100px;
}

.glow.two {
  right: -130px;
  bottom: -150px;
  background: #ff542f;
  animation-delay: -3s;
}

@keyframes glowMove {
  from { transform: translate(0, 0) scale(.8); opacity: .08; }
  to { transform: translate(65px, 35px) scale(1.25); opacity: .2; }
}

.wrapper {
  width: 100%;
  max-width: 410px;
  position: relative;
  z-index: 2;
  animation: appear .9s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(28px) scale(.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.card {
  position: relative;
  padding: 30px 25px 25px;
  overflow: hidden;
  isolation: isolate;
  border: 1px solid rgba(255, 65, 65, .34);
  border-radius: 27px;
  background: linear-gradient(145deg, rgba(30, 15, 16, .97), rgba(11, 8, 9, .97));
  box-shadow:
    0 0 45px rgba(255, 30, 42, .12),
    0 25px 80px rgba(0, 0, 0, .55),
    inset 0 1px rgba(255, 255, 255, .04);
  animation: cardGlow 4s ease-in-out infinite;
}

@keyframes cardGlow {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 30, 42, .1), 0 25px 80px #0009; }
  50% { box-shadow: 0 0 48px rgba(255, 30, 42, .2), 0 25px 80px #0009; }
}

.card::before {
  content: "";
  position: absolute;
  z-index: -1;
  width: 250px;
  height: 250px;
  top: -180px;
  left: 50%;
  transform: translateX(-50%);
  border-radius: 50%;
  background: #ff2935;
  filter: blur(90px);
  opacity: .25;
}

.card::after {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 65%;
  height: 1px;
  background: linear-gradient(90deg, transparent, #ff4a4a, transparent);
  animation: scan 5s linear infinite;
}

@keyframes scan {
  to { left: 150%; }
}

/* LOGO: NGỌN LỬA VÀ TRÁI ỚT KẾT HỢP */
.logo-wrap {
  width: 112px;
  height: 112px;
  margin: 0 auto 17px;
  display: grid;
  place-items: center;
  position: relative;
}

.logo-ring {
  position: absolute;
  inset: 3px;
  border: 1px solid rgba(255, 67, 58, .5);
  border-radius: 32px;
  transform: rotate(45deg);
  animation: ringPulse 3s ease-in-out infinite;
}

.logo-ring::before {
  content: "";
  position: absolute;
  inset: 8px;
  border: 1px dashed rgba(255, 120, 75, .35);
  border-radius: 24px;
}

@keyframes ringPulse {
  0%, 100% { transform: rotate(45deg) scale(.91); opacity: .5; }
  50% { transform: rotate(135deg) scale(1.03); opacity: 1; }
}

.logo {
  width: 88px;
  height: 88px;
  overflow: visible;
  filter: drop-shadow(0 0 10px rgba(255, 44, 37, .48));
  animation: logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-5px) rotate(2deg); }
}

.flame-main {
  transform-origin: 50% 65%;
  animation: flameDance 2.1s ease-in-out infinite alternate;
}

@keyframes flameDance {
  from { transform: rotate(-3deg) scale(.97); }
  to { transform: rotate(3deg) scale(1.035); }
}

.chili {
  transform-origin: 50% 50%;
  animation: chiliSway 3s ease-in-out infinite;
}

@keyframes chiliSway {
  0%, 100% { transform: rotate(-2deg); }
  50% { transform: rotate(2deg); }
}

.eyebrow {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  color: #ff7777;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.status-dot {
  width: 6px;
  height: 6px;
  background: #ff4149;
  border-radius: 50%;
  box-shadow: 0 0 10px #ff4149;
  animation: blink 1.4s infinite;
}

@keyframes blink {
  50% { opacity: .3; }
}

h1 {
  text-align: center;
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(25px, 7vw, 33px);
  line-height: 1.25;
  font-weight: 900;
  letter-spacing: 1px;
  background: linear-gradient(180deg, #fff 5%, #ffd4ce 40%, #ff5145 85%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 16px rgba(255, 48, 59, .2));
}

.version {
  width: fit-content;
  margin: 11px auto 0;
  padding: 5px 11px;
  border: 1px solid rgba(255, 69, 62, .3);
  border-radius: 30px;
  color: #ff9a8e;
  background: rgba(255, 50, 50, .07);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.8px;
}

.description {
  max-width: 290px;
  margin: 17px auto 23px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.8;
  text-align: center;
}

.divider {
  width: 100%;
  height: 1px;
  margin: 0 0 22px;
  background: linear-gradient(90deg, transparent, #622426, transparent);
}

.key-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.4px;
}

.key-label span:last-child {
  color: #ff7777;
  font-size: 9px;
  letter-spacing: 1px;
}

.key-box {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 56px;
  padding: 12px 13px;
  border: 1px solid rgba(255, 66, 66, .22);
  border-radius: 13px;
  background: rgba(0, 0, 0, .3);
  transition: border-color .25s, box-shadow .25s;
}

.key-box:focus-within,
.key-box:hover {
  border-color: rgba(255, 67, 67, .6);
  box-shadow: 0 0 18px rgba(255, 30, 40, .08);
}

.key-symbol {
  flex-shrink: 0;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 9px;
  color: #ff6969;
  background: rgba(255, 50, 50, .12);
}

#key {
  width: 100%;
  min-width: 0;
  color: #f5dada;
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 600;
  background: transparent;
  border: none;
  outline: none;
}

.copy-btn {
  width: 100%;
  min-height: 51px;
  margin-top: 13px;
  position: relative;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  border: 1px solid rgba(255, 120, 100, .55);
  border-radius: 13px;
  color: #fff;
  background: linear-gradient(105deg, #c71925, #ff3939 55%, #e62b24);
  box-shadow: 0 7px 24px rgba(255, 30, 40, .18), inset 0 1px rgba(255,255,255,.22);
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1.5px;
  cursor: pointer;
  transition: transform .2s, box-shadow .2s, filter .2s;
}

.copy-btn::before {
  content: "";
  position: absolute;
  top: 0;
  left: -120%;
  width: 65%;
  height: 100%;
  transform: skewX(-25deg);
  background: linear-gradient(90deg, transparent, #ffffff45, transparent);
  transition: left .6s;
}

.copy-btn:hover::before {
  left: 150%;
}

.copy-btn:hover {
  transform: translateY(-2px);
  filter: brightness(1.1);
  box-shadow: 0 10px 30px rgba(255, 30, 40, .3);
}

.copy-btn:active {
  transform: scale(.98);
}

.copy-btn.copied {
  background: linear-gradient(105deg, #a21b26, #d83232);
}

.note {
  min-height: 16px;
  margin-top: 10px;
  text-align: center;
  color: #ff8888;
  font-size: 10px;
}

.footer {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  margin-top: 21px;
  color: #756566;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.footer-icon {
  color: #ff4545;
}

@media (max-width: 420px) {
  body { padding: 16px; }
  .card { padding: 25px 19px 22px; border-radius: 23px; }
  .logo-wrap { width: 100px; height: 100px; }
  .logo { width: 80px; height: 80px; }
  .description { margin-top: 14px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>
<canvas id="embers"></canvas>
<div class="glow one"></div>
<div class="glow two"></div>

<main class="wrapper">
  <section class="card">

    <div class="logo-wrap">
      <div class="logo-ring"></div>

      <!-- Logo kết hợp ngọn lửa và trái ớt -->
      <svg class="logo" viewBox="0 0 120 120"
           xmlns="http://www.w3.org/2000/svg"
           role="img" aria-label="Chilli Hub flame chili logo">

        <defs>
          <linearGradient id="outerFire" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#ff2525"/>
            <stop offset="55%" stop-color="#ff542e"/>
            <stop offset="100%" stop-color="#ffb347"/>
          </linearGradient>

          <linearGradient id="innerFire" x1="0" y1="1" x2=".7" y2="0">
            <stop offset="0%" stop-color="#ff6b32"/>
            <stop offset="100%" stop-color="#fff0a3"/>
          </linearGradient>

          <linearGradient id="pepper" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff7160"/>
            <stop offset="40%" stop-color="#f52230"/>
            <stop offset="100%" stop-color="#9e0718"/>
          </linearGradient>

          <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#c6ff8c"/>
            <stop offset="100%" stop-color="#45bd55"/>
          </linearGradient>

          <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <g class="flame-main" filter="url(#softGlow)">
          <path d="M61 7
                   C66 22 82 27 82 43
                   C96 34 94 22 91 17
                   C110 38 112 57 102 77
                   C94 96 77 108 57 108
                   C35 108 18 93 16 73
                   C14 56 25 43 38 30
                   C37 45 43 51 48 54
                   C54 41 53 25 61 7Z"
                fill="url(#outerFire)"/>

          <path d="M62 36
                   C65 49 77 55 76 67
                   C84 62 85 54 84 51
                   C95 67 89 86 75 94
                   C62 102 45 95 40 83
                   C35 70 43 61 52 52
                   C51 65 56 68 59 70
                   C65 60 62 47 62 36Z"
                fill="url(#innerFire)"/>
        </g>

        <g class="chili">
          <!-- Cuống ớt -->
          <path d="M59 40
                   C58 32 63 26 72 24
                   C80 22 86 26 87 31
                   C80 29 74 31 72 37
                   L69 44Z"
                fill="url(#leaf)"
                stroke="#287c38"
                stroke-width="1.4"
                stroke-linejoin="round"/>

          <!-- Thân ớt cong -->
          <path d="M62 39
                   C49 38 37 45 33 57
                   C28 72 39 87 52 88
                   C64 89 74 78 77 65
                   C80 55 76 45 68 40
                   C66 39 64 39 62 39Z"
                fill="url(#pepper)"
                stroke="#ff9a75"
                stroke-width="1.5"
                stroke-linejoin="round"/>

          <!-- Đuôi nhọn của trái ớt -->
          <path d="M53 86
                   C55 94 49 100 42 103
                   C54 103 65 96 65 85Z"
                fill="#d9182b"
                stroke="#ff6251"
                stroke-width="1.2"
                stroke-linejoin="round"/>

          <!-- Đường sáng trên thân ớt -->
          <path d="M43 54
                   C39 62 42 71 49 75"
                fill="none"
                stroke="#ffb0a0"
                stroke-width="3"
                stroke-linecap="round"
                opacity=".75"/>

          <path d="M50 46
                   C54 43 59 42 63 44"
                fill="none"
                stroke="#ffb9a4"
                stroke-width="2"
                stroke-linecap="round"
                opacity=".7"/>
        </g>

        <!-- Tia lửa trang trí -->
        <path d="M25 39 L29 33 L31 41 L37 43 L30 46 L28 52 L26 45 L20 43Z"
              fill="#ffd18a" opacity=".9"/>
        <circle cx="91" cy="48" r="2.2" fill="#ffe2a3"/>
        <circle cx="29" cy="64" r="1.7" fill="#fff0c2"/>
        <circle cx="88" cy="83" r="2" fill="#ffb36a"/>
      </svg>
    </div>

    <div class="eyebrow">
      <span class="status-dot"></span>
      PREMIUM KEY SYSTEM
    </div>

    <h1>CHILLI HUB</h1>

    <div class="version">V6 · PRO EDITION</div>

    <p class="description">
      Welcome to Chilli Hub.<br>
      Your key is ready. Copy it with one click.
    </p>

    <div class="divider"></div>

    <div class="key-label">
      <span>YOUR ACCESS KEY</span>
      <span>● READY</span>
    </div>

    <div class="key-box">
      <div class="key-symbol">
        <svg width="17" height="17" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="15" r="5"/>
          <path d="m11.5 11.5 8-8L22 6l-3 3 2 2-3 3-2-2-3 3"/>
        </svg>
      </div>

      <input
        id="key"
        type="text"
        value="ChilliHubV6ProJskwowiLapwowhebiBakaowowjwkPqpwiow"
        readonly
        aria-label="Your Chilli Hub access key"
      />
    </div>

    <button class="copy-btn" id="copyBtn" type="button">
      <svg width="17" height="17" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="8" width="13" height="13" rx="2"/>
        <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>
      </svg>
      <span id="copyText">COPY KEY</span>
    </button>

    <div class="note" id="note" aria-live="polite"></div>

    <footer class="footer">
      <span class="footer-icon">✦</span>
      CHILLI HUB
      <span>·</span>
      MADE WITH PASSION
      <span class="footer-icon">✦</span>
    </footer>

  </section>
</main>

<script>
/* COPY KEY */
const keyInput = document.getElementById('key');
const copyBtn = document.getElementById('copyBtn');
const copyText = document.getElementById('copyText');
const note = document.getElementById('note');

async function copyKey() {
  const value = keyInput.value;

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(value);
    } else {
      keyInput.focus();
      keyInput.select();
      keyInput.setSelectionRange(0, value.length);

      const copied = document.execCommand('copy');
      if (!copied) throw new Error('Copy failed');
      keyInput.setSelectionRange(0, 0);
      keyInput.blur();
    }

    copyText.textContent = 'KEY COPIED!';
    note.textContent = 'Your key has been copied successfully.';
    copyBtn.classList.add('copied');

    setTimeout(() => {
      copyText.textContent = 'COPY KEY';
      note.textContent = '';
      copyBtn.classList.remove('copied');
    }, 2200);
  } catch (error) {
    keyInput.focus();
    keyInput.select();
    note.textContent = 'Key selected. Please copy it manually.';
  }
}

copyBtn.addEventListener('click', copyKey);

/* FLOATING EMBERS */
const canvas = document.getElementById('embers');
const ctx = canvas.getContext('2d');
let particles = [];
let width = 0;
let height = 0;
let animationFrame;

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  width = window.innerWidth;
  height = window.innerHeight;

  canvas.width = width * dpr;
  canvas.height = height * dpr;
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const count = Math.min(65, Math.max(22, Math.floor(width / 7)));
  particles = Array.from({ length: count }, () => createParticle(true));
}

function random(min, max) {
  return Math.random() * (max - min) + min;
}

function createParticle(initial = false) {
  return {
    x: random(0, width),
    y: initial ? random(0, height) : height + random(5, 70),
    size: random(1, 3),
    speed: random(.25, 1.05),
    drift: random(-.35, .35),
    alpha: random(.25, .8),
    phase: random(0, Math.PI * 2),
    life: random(100, 300)
  };
}

function drawParticles() {
  ctx.clearRect(0, 0, width, height);

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];

    p.y -= p.speed;
    p.x += p.drift + Math.sin(p.phase) * .25;
    p.phase += .018;
    p.life--;

    const pulse = .65 + Math.sin(p.phase * 2) * .25;

    ctx.beginPath();
    ctx.fillStyle = `rgba(255, ${Math.floor(random(65, 115))}, 65, ${p.alpha * pulse})`;
    ctx.shadowColor = '#ff302a';
    ctx.shadowBlur = 9;
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();

    if (p.y < -10 || p.x < -10 || p.x > width + 10 || p.life <= 0) {
      particles[i] = createParticle();
    }
  }

  ctx.shadowBlur = 0;
  animationFrame = requestAnimationFrame(drawParticles);
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
drawParticles();

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    cancelAnimationFrame(animationFrame);
  } else {
    cancelAnimationFrame(animationFrame);
    drawParticles();
  }
});
</script>
</body>
